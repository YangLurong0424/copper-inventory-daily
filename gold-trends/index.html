const DATA=JSON.parse(document.getElementById('trend-data').textContent);const LABELS={'1w':'过去一周','1m':'过去一个月','3m':'过去三个月','6m':'过去半年','1y':'过去一年'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:Math.abs(v)>=100?1:Math.abs(v)>=10?2:4}).format(v);function render(key){const rows=DATA[key]||[];document.getElementById('period-title').textContent=LABELS[key]+'明显趋势';document.getElementById('period-note').textContent=`共 ${rows.length} 项；红色为上行，绿色为下行，“方向反转”表示与前一同周期方向相反。`;document.getElementById('grid').innerHTML=rows.length?rows.map((x,i)=>`<article class="${Math.abs(x.z)>=2.5?'major':''}"><div class="top"><div><h2>${esc(x.name)}</h2><div class="source">${esc(x.sheet)} · ${esc(x.group)} · ${esc(x.chart)}</div></div><span class="badge ${x.delta>=0?'up':'down'}">${x.direction}${x.reversal?' · 方向反转':''}</span></div><div class="numbers"><div class="number"><small>区间变化</small><strong>${x.delta>0?'+':''}${num(x.delta)}</strong></div><div class="number"><small>变化比例</small><strong>${x.pct==null?'—':(x.pct>0?'+':'')+(x.pct*100).toFixed(1)+'%'}</strong></div><div class="number"><small>历史异常度</small><strong>${Math.abs(x.z).toFixed(1)}σ</strong></div></div><div class="why"><p><b>指标含义：</b>${esc(x.definition)}</p><p><b>一般看什么：</b>${esc(x.watch||'结合趋势方向、持续性和其他相关指标交叉验证。')}</p><p><b>对金价逻辑：</b>${esc(x.logic)}</p><p class="source">${esc(x.baseDate)} → ${esc(x.latestDate)}；最新值 ${num(x.latest)}</p></div></article>`).join(''):'<div class="empty">这一周期暂未发现达到阈值的有效趋势。</div>'}document.querySelectorAll('[data-horizon]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-horizon]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.horizon)});render('1w');
</script></body></html>
