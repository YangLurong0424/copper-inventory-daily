definition":"美国担保隔夜融资利率（SOFR）减去准备金余额利率（IORB）的利差，通常以百分点或基点表示。IORB 是美联储付给合格机构准备金的利率。","watch":"一般看回购市场融资需求相对银行准备金收益的松紧。利差明显上升、尤其转正，可能表示抵押融资偏紧或资产负债表容量受约束；需要结合月末、季末、国债结算和准备金余额判断。","logic":"SOFR相对管理利率上行意味着抵押融资边际趋紧，会抬高持金机会成本；若演化为资金压力，也可能反过来增强避险需求。","horizon":"过去一年"},{"key":"金银比","name":"金银比","chart":"美国5年期盈亏平衡通胀率 · 美国10年期盈亏平衡通胀率 · 金银比","sheet":"宏观-周","group":"通胀预期×贵金属相对价值","latestDate":"2026-08-28","baseDate":"2025-08-22","latest":67.14210335886149,"delta":-19.548778147001514,"pct":-0.22549981967456875,"z":-1.8575514695174906,"direction":"下行","reversal":true,"definition":"同币种、同重量口径下黄金价格除以白银价格，表示一盎司黄金可兑换多少盎司白银，是无量纲相对价格。","watch":"上升通常表示黄金相对白银更强，偏防御、避险或工业周期转弱；下降多见于再通胀、制造业改善或白银高弹性阶段。","logic":"再通胀和增长改善通常更利好高弹性的白银，金银比可能下行；滞胀或增长担忧时黄金常跑赢白银，金银比上行。实际利率决定通胀变化能否转化为金价支撑。","horizon":"过去一年"},{"key":"美元指数非商业多头","name":"美元指数期货非商业多头","chart":"美元指数期货非商业净多持仓 · 美元指数期货非商业多头 · 美元指数期货非商业空头","sheet":"宏观-周","group":"美债CFTC仓位","latestDate":"2026-08-25","baseDate":"2025-08-19","latest":29042.0,"delta":17683.0,"pct":1.5567391495730258,"z":1.773052131429185,"direction":"上行","reversal":true,"definition":"CFTC 持仓报告中美元指数期货非商业交易者的多头合约数，单位为合约张数。","watch":"多头增加表示投机资金更偏强美元；需与空头、净多、总持仓和美元现货走势同时看，避免换月造成假信号。","logic":"美债净多增加更接近押注债价上涨、收益率下降，通常利多黄金；净空增加通常意味着收益率上行压力，对黄金偏压制。","horizon":"过去一年"},{"key":"美tips5年","name":"美国5年期 TIPS 实际收益率","chart":"伦敦现货黄金 · 美国5年期 TIPS 实际收益率 · 美国10年期 TIPS 实际收益率","sheet":"宏观-日","group":"实际利率","latestDate":"2026-09-01","baseDate":"2025-09-01","latest":2.18,"delta":0.9700000000000002,"pct":0.8016528925619837,"z":1.756837209302326,"direction":"上行","reversal":true,"definition":"美国5年期通胀保值国债的市场实际收益率，单位为百分比；在本图中位于倒置的右轴，以便与黄金作视觉比较。","watch":"先按原始收益率判断涨跌，不要把倒置坐标误读为负值；再与10年期实际收益率比较，以区分政策端与长期增长、通胀因素。","logic":"黄金不付息，实际利率上升会提高持有黄金的机会成本，通常压制金价；实际利率下降或转负通常支撑金价。原Excel把TIPS轴反向就是为了观察这种负相关。","horizon":"过去一年"},{"key":"伦金crb","name":"黄金/CRB 商品指数比值","chart":"伦敦现货黄金 · 黄金/CRB 商品指数比值","sheet":"宏观-日","group":"商品与相对价值","latestDate":"2026-09-01","baseDate":"2025-09-01","latest":10.539688725430498,"delta":-0.9551020799275296,"pct":-0.08308999233655745,"z":-1.7254266625497046,"direction":"下行","reversal":true,"definition":"伦敦金价格除以 RJ/CRB 商品指数点位，是相对强弱比值，数值单位取决于两者报价口径，主要用于比较而非解释绝对水平。","watch":"上升表示黄金跑赢广谱商品，偏货币、避险或增长放缓；下降表示周期商品更强，偏再通胀和实体需求。","logic":"商品上涨可抬升通胀预期并在实际利率受控时支撑黄金；金油比或金/CRB上升则表示黄金跑赢周期商品，常见于防御、增长担忧或金融压力。","horizon":"过去一年"},{"key":"cnh即期","name":"离岸人民币即期汇率（USD/CNH）","chart":"黄金进口盈亏（现货口径） · 离岸人民币即期汇率（USD/CNH）","sheet":"黄金-日","group":"境内外价差","latestDate":"2026-09-01","baseDate":"2025-09-01","latest":6.7218,"delta":-0.41140000000000043,"pct":-0.057673975214490046,"z":-1.6119957495041144,"direction":"下行","reversal":true,"definition":"离岸市场美元兑人民币即期汇率，即 1 美元可兑换多少离岸人民币。数值上升表示人民币相对美元贬值，下降表示人民币升值。","watch":"一般看人民币计价黄金的汇率传导和进口成本。CNH 上升会机械性抬高海外黄金折算成人民币后的价格；判断境内金价是否独立走强，应把汇率影响与进口盈亏分开。","logic":"境内溢价或进口利润改善，通常反映中国实物需求更强并提升进口动力；CNH走弱会抬高人民币计价黄金，可能放大境内价格但也压缩进口利润。","horizon":"过去一年"},{"key":"美tips5y","name":"美国5年期 TIPS 实际收益率","chart":"美国5年期 TIPS 实际收益率 · 美国10年期 TIPS 实际收益率 · 伦敦现货黄金","sheet":"宏观-周","group":"Fed资产负债表/QT×实际利率","latestDate":"2026-08-28","baseDate":"2025-08-22","latest":2.18,"delta":0.9000000000000001,"pct":0.7031250000000001,"z":1.5660804597701143,"direction":"上行","reversal":true,"definition":"美国5年期通胀保值国债的市场到期收益率，年化百分比表示，更敏感于中期政策利率与通胀路径。","watch":"看其变化是否由名义利率还是通胀补偿驱动；下降通常降低黄金机会成本，需与10年期实际收益率和美元同看。","logic":"TIPS持仓下降/QT可能通过久期供给和期限溢价推高实际收益率，从而压制黄金；扩表通常方向相反。","horizon":"过去一年"},{"key":"td金1年化","name":"Au(T+D)－沪金近月年化价差","chart":"Au(T+D)－沪金近月年化价差 · 股份制银行6个月同业存单发行利率","sheet":"黄金-日","group":"黄金基差与融资","latestDate":"2026-09-01","baseDate":"2025-09-01","latest":-0.01896846301701478,"delta":0.02174606315222768,"pct":0.5341106773988594,"z":1.56118884631021,"direction":"上行","reversal":true,"definition":"将 Au(T+D) 与沪金近月（“金1”）之间的价差按剩余期限折算成年化比例，用来衡量境内现货/延期与近月期货之间隐含的持有收益或融资成本。正负方向取决于原表公式。","watch":"一般与同业存单利率、短期资金成本和交割期限一起看。价差长期偏离资金成本可能反映套利受限、交割需求或合约切换；跨月时容易跳变，不宜只看绝对正负。","logic":"融资成本上升会抬高理论升水；基差相对融资成本异常走阔，更可能反映现货紧张、交割或套利约束，对人民币金价偏支撑。","horizon":"过去一年"},{"key":"非商业净多头","name":"美债期货非商业净多头","chart":"美债期货非商业净多头 · CBOT 美债期货非商业多头 · CBOT 美债期货非商业空头","sheet":"宏观-周","group":"资产负债表×短端利率","latestDate":"2026-08-25","baseDate":"2025-08-19","latest":-187243.0,"delta":-136200.0,"pct":-2.6683384597300317,"z":-1.5460658316908042,"direction":"下行","reversal":false,"definition":"CBOT 美债期货非商业多头合约数减空头合约数，单位为合约张数；正值为净多，负值为净空。","watch":"净多上升一般表示更偏债价上涨、收益率下降；同时看绝对多空、总持仓、换月和极端分位，极端仓位可能带来挤仓或反向波动。","logic":"扩表与短端利率下降通常改善流动性、降低持金机会成本，对黄金偏支撑；缩表与短端利率上升通常相反。","horizon":"过去一年"}]}</script><script>
const DATA=JSON.parse(document.getElementById('trend-data').textContent);const LABELS={'1w':'过去一周','1m':'过去一个月','3m':'过去三个月','6m':'过去半年','1y':'过去一年'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:Math.abs(v)>=100?1:Math.abs(v)>=10?2:4}).format(v);function render(key){const rows=DATA[key]||[];document.getElementById('period-title').textContent=LABELS[key]+'明显趋势';document.getElementById('period-note').textContent=`共 ${rows.length} 项；红色为上行，绿色为下行，“方向反转”表示与前一同周期方向相反。`;document.getElementById('grid').innerHTML=rows.length?rows.map((x,i)=>`<article class="${Math.abs(x.z)>=2.5?'major':''}"><div class="top"><div><h2>${esc(x.name)}</h2><div class="source">${esc(x.sheet)} · ${esc(x.group)} · ${esc(x.chart)}</div></div><span class="badge ${x.delta>=0?'up':'down'}">${x.direction}${x.reversal?' · 方向反转':''}</span></div><div class="numbers"><div class="number"><small>区间变化</small><strong>${x.delta>0?'+':''}${num(x.delta)}</strong></div><div class="number"><small>变化比例</small><strong>${x.pct==null?'—':(x.pct>0?'+':'')+(x.pct*100).toFixed(1)+'%'}</strong></div><div class="number"><small>历史异常度</small><strong>${Math.abs(x.z).toFixed(1)}σ</strong></div></div><div class="why"><p><b>指标含义：</b>${esc(x.definition)}</p><p><b>一般看什么：</b>${esc(x.watch||'结合趋势方向、持续性和其他相关指标交叉验证。')}</p><p><b>对金价逻辑：</b>${esc(x.logic)}</p><p class="source">${esc(x.baseDate)} → ${esc(x.latestDate)}；最新值 ${num(x.latest)}</p></div></article>`).join(''):'<div class="empty">这一周期暂未发现达到阈值的有效趋势。</div>'}document.querySelectorAll('[data-horizon]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-horizon]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.horizon)});render('1w');
</script></body></html>
