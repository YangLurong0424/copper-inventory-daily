</style></head><body><header><small>MULTI-HORIZON TREND SCAN</small><h1>黄金多周期趋势扫描</h1><p>分别观察一周、一个月、三个月、半年和一年内，相对指标自身历史波动最明显的趋势。排名衡量“变化是否异常”，不代表对金价的单向预测。</p><div class="meta">数据截至 2026-11-09 · 生成时间 2026-11-09T20:04:13+08:00 · 已排除 1 条可疑占位 0 序列</div></header><main><nav class="tabs"><button data-horizon="1w" class="active">过去一周<span>22</span></button><button data-horizon="1m" class="">过去一个月<span>24</span></button><button data-horizon="3m" class="">过去三个月<span>20</span></button><button data-horizon="6m" class="">过去半年<span>24</span></button><button data-horizon="1y" class="">过去一年<span>24</span></button></nav><div class="summary"><div><strong id="period-title">过去一周明显趋势</strong><div id="period-note"></div></div><a href="../gold-dashboard/">返回完整图谱 →</a></div><section class="grid" id="grid"></section></main><footer>方法：每条指标的本期变化与其过去三年同期限变化比较；|稳健 Z 值|≥1.5 才进入列表，≥2.5 高亮。末端异常精确为 0、陈旧或错误序列不参与排名。</footer><script id="trend-data" type="application/json">{"1w":[{"key":"上升","name":"下次 FOMC 目标利率上调概率","chart":"下次 FOMC 目标利率下调概率 · 下次 FOMC 目标利率持平概率 · 下次 FOMC 目标利率上调概率","sheet":"宏观-日","group":"美联储政策预期","latestDate":"2026-11-06","baseDate":"2026-10-30","latest":76.3,"delta":5.599999999999994,"pct":0.07920792079207913,"z":55999999.99999994,"direction":"上行","reversal":false,"definition":"市场根据利率期货推算的下次 FOMC 会议目标利率上调概率，单位为百分比。","watch":"概率上升通常意味着更高的短端利率和美元支持，但需确认对应会议及上调幅度；与持平、下降概率合看。","logic":"更低的政策利率或更高的降息概率通常降低黄金机会成本并压低美元，对金价偏支撑；但若降息来自严重衰退，避险渠道会进一步放大。","horizon":"过去一周"},{"key":"同业存单发行利率股份制银行6个月","name":"股份制银行6个月同业存单发行利率","chart":"股份制银行6个月同业存单发行利率 · 股份制银行1年期同业存单发行利率","sheet":"黄金-日","group":"中国资金价格","latestDate":"2026-11-09","baseDate":"2026-11-02","latest":-0.013733,"delta":-0.013733,"pct":null,"z":-33.561393999516,"direction":"下行","reversal":true,"definition":"中国股份制银行新发行 6 个月同业存单时的融资利率，通常以年利率百分比表示，是境内中短期银行批发融资成本的常用代理。","watch":"一般与黄金年化价差比较，判断价差是否足以覆盖资金成本。利率快速上升常表示资金偏紧；同时看 1 年期利率可判断曲线陡峭或倒挂。","logic":"存单利率下降通常意味着境内流动性宽松、持有黄金的机会成本下降，并可能通过人民币汇率支持人民币金价；对美元金价的传导较间接。","horizon":"过去一周"},{"key":"现货主力年化", const DATA=JSON.parse(document.getElementById('trend-data').textContent);const LABELS={'1w':'过去一周','1m':'过去一个月','3m':'过去三个月','6m':'过去半年','1y':'过去一年'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:Math.abs(v)>=100?1:Math.abs(v)>=10?2:4}).format(v);function render(key){const rows=DATA[key]||[];document.getElementById('period-title').textContent=LABELS[key]+'明显趋势';document.getElementById('period-note').textContent=`共 ${rows.length} 项；红色为上行，绿色为下行，“方向反转”表示与前一同周期方向相反。`;document.getElementById('grid').innerHTML=rows.length?rows.map((x,i)=>`<article class="${Math.abs(x.z)>=2.5?'major':''}"><div class="top"><div><h2>${esc(x.name)}</h2><div class="source">${esc(x.sheet)} · ${esc(x.group)} · ${esc(x.chart)}</div></div><span class="badge ${x.delta>=0?'up':'down'}">${x.direction}${x.reversal?' · 方向反转':''}</span></div><div class="numbers"><div class="number"><small>区间变化</small><strong>${x.delta>0?'+':''}${num(x.delta)}</strong></div><div class="number"><small>变化比例</small><strong>${x.pct==null?'—':(x.pct>0?'+':'')+(x.pct*100).toFixed(1)+'%'}</strong></div><div class="number"><small>历史异常度</small><strong>${Math.abs(x.z).toFixed(1)}σ</strong></div></div><div class="why"><p><b>指标含义：</b>${esc(x.definition)}</p><p><b>一般看什么：</b>${esc(x.watch||'结合趋势方向、持续性和其他相关指标交叉验证。')}</p><p><b>对金价逻辑：</b>${esc(x.logic)}</p><p class="source">${esc(x.baseDate)} → ${esc(x.latestDate)}；最新值 ${num(x.latest)}</p></div></article>`).join(''):'<div class="empty">这一周期暂未发现达到阈值的有效趋势。</div>'}document.querySelectorAll('[data-horizon]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-horizon]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.horizon)});render('1w');
</script></body></html>
