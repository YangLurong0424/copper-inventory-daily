</style></head><body><header><small>MULTI-HORIZON TREND SCAN</small><h1>黄金多周期趋势扫描</h1><p>分别观察一周、一个月、三个月、半年和一年内，相对指标自身历史波动最明显的趋势。排名衡量“变化是否异常”，不代表对金价的单向预测。</p><div class="meta">数据截至 2026-09-29 · 生成时间 2026-09-30T08:29:53+08:00 · 已排除 13 条可疑占位 0 序列</div></header><main><nav class="tabs"><button data-horizon="1w" class="active">过去一周<span>24</span></button><button data-horizon="1m" class="">过去一个月<span>24</span></button><button data-horizon="3m" class="">过去三个月<span>24</span></button><button data-horizon="6m" class="">过去半年<span>24</span></button><button data-horizon="1y" class="">过去一年<span>24</span></button></nav><div class="summary"><div><strong id="period-title">过去一周明显趋势</strong><div id="period-note"></div></div><a href="../gold-dashboard/">返回完整图谱 →</a></div><section class="grid" id="grid"></section></main><footer>方法：每条指标的本期变化与其过去三年同期限变化比较；|稳健 Z 值|≥1.5 才进入列表，≥2.5 高亮。末端异常精确为 0、陈旧或错误序列不参与排名。</footer><script id="trend-data" type="application/json">{"1w":[{"key":"上升","name":"下次 FOMC 目标利率上调概率","chart":"下次 FOMC 目标利率下调概率 · 下次 FOMC 目标利率持平概率 · 下次 FOMC 目标利率上调概率","sheet":"宏观-日","group":"美联储政策预期","latestDate":"2026-09-28","baseDate":"2026-09-21","latest":70.3,"delta":12.699999999999996,"pct":0.22048611111111102,"z":126999999.99999994,"direction":"上行","reversal":true,"definition":"市场根据利率期货推算的下次 FOMC 会议目标利率上调概率，单位为百分比。","watch":"概率上升通常意味着更高的短端利率和美元支持，但需确认对应会议及上调幅度；与持平、下降概率合看。","logic":"更低的政策利率或更高的降息概率通常降低黄金机会成本并压低美元，对金价偏支撑；但若降息来自严重衰退，避险渠道会进一步放大。","horizon":"过去一周"},{"key":"comex库存千克","name":"COMEX黄金库存（千克）","chart":"COMEX黄金库存（千克） · COMEX黄金主力（15:00）","sheet":"黄金-日","group":"实物与库存","latestDate":"2026-09-28","baseDate":"2026-09-21","latest":727448.8148314034,"delta":-125278.71268743754,"pct":-0.1469152908103691,"z":-14.84705614060739,"direction":"下行","reversal":true,"definition":"COMEX 认可金库报告的黄金库存，工作簿换算为千克。若原始口径为总库存，通常包含可交割的 registered 和符合标准但未指定交割的 eligible 两部分。","watch":"一般看可供期货交割的缓冲是否持续下降，并与交割量、近远月价差一起判断是否存在现货紧张。库存下降不必然等于短缺，registered 与 eligible 的转换也会造成结构性变化。","logic":"库存持续下降、同时价格或近月升水走强，通常指向实物趋紧并支撑金价；库存上升则增加交割缓冲。","horizon":"过去一周"},{"key":"交易所库存合计千克","name":"黄金交易所库存合计（千克）","chart":"黄金交易所库存合计（千克） · COMEX黄金主力（15:00）","sheet":"黄金-日","group":"实物与库存","latestDate":"2026-09-28","baseDate":"2026-09-21","latest":843479.8148314034,"delta":-124078.71268743754,"pct":-0.12823897382788702,"z":-14.39226122144994,"direction":"下行","reversal":true,"definition":"工作簿汇总口径内，各黄金交易所或其认可金库库存的合计值，以千克计。包含哪些交易所、是否同时包含可交割与非指定交割库存，以原表明细为准。","watch":"一般观察交易体系内可见库存的中期流入流出。多个市场同步去库比单一仓库转移更有信息量；应与 ETF 持金、交割和期限价差联动，避免把库间搬运当作真实消耗。","logic":"库存持续下降、同时价格或近月升水走强，通常指向实物趋紧并支撑金价；库存上升则增加交割缓冲。","horizon":"过去一周"},{"key":"etf持仓合计","name":"黄金ETF持金量合计","chart":"黄金ETF持金量合计 · COMEX黄金主力（15:00）","sheet":"黄金-日","group":"投资资金流","latestDate":"2026-09-28","baseDate":"2026-09-21","latest":1552.2423050000002,"delta":-119.33133199999975,"pct":-0.0713886181013034,"z":-12.912075958463296,"direction":"下行","reversal":true,"definition":"工作簿完整统计范围内，实物支持型黄金 ETF 持有的黄金数量合计，通常以吨计；“合计”的具体基金覆盖范围以原表清单为准。","watch":"一般看全球投资资金对黄金的中期配置方向。连续增持通常意味着 ETF 净申购和实物需求增强，连续减持则相反；它与金价常同向，但存在申赎结算滞后。","logic":"持有量增加代表ETF净申购和实物需求，通常对金价偏支撑；持有量下降代表赎回压力。市值还会被金价本身推动，判断资金流时持有量比市值更干净。","horizon":"过去一周"},{"key":"美债收益率3m","name":"美国3个月国债收益率","chart":"3个月期限 SOFR－3个月美债收益率 · 3个月期限 SOFR · 美国3个月国债收益率","sheet":"宏观-日","group":"美元资金价格","latestDate":"2026-09-28","baseDate":"2026-09-21","latest":4.28,"delta":0.11000000000000032,"pct":0.026378896882494084,"z":4.046944556859481,"direction":"上行","reversal":false,"definition":"美国3个月期国库券或收益率曲线节点的年化收益率，接近现金无风险收益并受当前政策利率与票据供给影响。","watch":"看与有效联邦基金利率、SOFR 和1年期收益率的差异；高位会抬升持金现金机会成本。","logic":"SOFR相对短债走高通常显示融资偏紧并抬高持金机会成本；异常扩大也可作为金融压力信号。","horizon":"过去一周"},{"key":"伦敦金","name":"伦敦现货黄金","chart":"伦敦现货黄金 · 美国5年期 TIPS 实际收益率 · 美国10年期 TIPS 实际收益率","sheet":"宏观-日","group":"实际利率","latestDate":"2026-09-29","baseDate":"2026-09-22","latest":4115.24,"delta":-242.71000000000004,"pct":-0.0556936174118565,"z":-3.7514019887456045,"direction":"下行","reversal":true,"definition":"国际伦敦现货黄金价格，通常以美元/金衡盎司报价，是全球黄金现货定价基准之一。","watch":"作为被解释变量时，重点
