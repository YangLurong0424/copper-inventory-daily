server {
    listen 80;
    server_name 106.54.200.6;

    location /health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /copper-counter {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://yanglurong0424.github.io" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8008/copper-counter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin "https://yanglurong0424.github.io" always;
    }
}
