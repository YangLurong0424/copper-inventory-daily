<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="黄金、利率、流动性、汇率、库存与资金流的交互式图表跟踪页">
  <title>黄金驱动因子图谱</title>
  <style>:root {
  color-scheme: light;
  --ink: #15201d;
  --muted: #68736f;
  --paper: #fffefb;
  --canvas: #f2f0ea;
  --line: #dedbd1;
  --gold: #b68528;
  --gold-bright: #d9ae57;
  --green: #147d64;
  --red: #b44b43;
  --navy: #14231f;
  --shadow: 0 14px 36px rgba(27, 38, 34, 0.08);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 8% 0%, rgba(215, 180, 102, 0.14), transparent 24rem),
    var(--canvas);
  color: var(--ink);
  font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.5;
}

button,
input,
select { font: inherit; }

button { cursor: pointer; }

a { color: inherit; }

.hero {
  position: relative;
  overflow: hidden;
  color: #f6f3e9;
  background:
    linear-gradient(118deg, rgba(13, 30, 26, 0.96), rgba(20, 35, 31, 0.93)),
    #14231f;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.hero::after {
  content: "";
  position: absolute;
  width: 34rem;
  height: 34rem;
  right: -14rem;
  top: -22rem;
  border: 1px solid rgba(217, 174, 87, 0.3);
  border-radius: 50%;
  box-shadow: 0 0 0 5rem rgba(217, 174, 87, 0.025), 0 0 0 10rem rgba(217, 174, 87, 0.018);
  pointer-events: none;
}

.hero-inner,
.shell {
  width: min(1480px, calc(100% - 40px));
  margin: 0 auto;
}

.hero-inner {
  position: relative;
  z-index: 1;
  padding: 46px 0 34px;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--gold-bright);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.hero h1 {
  max-width: 920px;
  margin: 0;
  font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
  font-size: clamp(34px, 5vw, 62px);
  font-weight: 600;
  line-height: 1.06;
  letter-spacing: -0.035em;
}

.hero-copy {
  max-width: 920px;
  margin: 18px 0 0;
  color: rgba(246, 243, 233, 0.76);
  font-size: 15px;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.meta-pill,
.tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: 999px;
  white-space: nowrap;
}

.meta-pill {
  padding: 7px 11px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.055);
  color: rgba(255,255,255,0.86);
  font-size: 12px;
}

.meta-pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-bright);
}

.source-bar {
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid rgba(25, 37, 33, 0.12);
  background: rgba(248, 247, 242, 0.92);
  backdrop-filter: blur(18px);
}

.source-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 62px;
}

.source-state {
  min-width: 0;
}

.source-state strong,
.source-state span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-state strong { font-size: 13px; }
.source-state span { color: var(--muted); font-size: 11px; }

.source-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.button,
.file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  transition: border-color 150ms, transform 150ms, background 150ms;
}

.button:hover,
.file-button:hover { border-color: #b8b3a6; background: #fff; }
.button:active,
.file-button:active { transform: translateY(1px); }
.button.primary,
.file-button.primary { border-color: #9d762a; background: var(--gold); color: #fff; }
.button:disabled { cursor: not-allowed; opacity: 0.48; }
.file-button input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }

.shell { padding: 28px 0 64px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.stat-card {
  min-height: 112px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 254, 251, 0.84);
  box-shadow: 0 6px 18px rgba(32, 42, 38, 0.04);
}

.stat-card span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.04em;
}

.stat-card strong {
  display: block;
  margin-top: 5px;
  font-family: Georgia, "Noto Serif SC", serif;
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 600;
  line-height: 1.1;
}

.stat-card small {
  display: block;
  margin-top: 7px;
  color: #77807d;
  font-size: 10px;
}

.notice {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  margin: 16px 0 0;
  padding: 13px 15px;
  border: 1px solid #dfd5ba;
  border-radius: 11px;
  background: #fbf7ea;
  color: #594b2f;
  font-size: 12px;
}

.notice-icon {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ead89f;
  color: #69511d;
  font-weight: 800;
}

.report-map {
  margin-top: 18px;
  padding: 20px;
  border: 1px solid #d9cfb7;
  border-radius: 15px;
  background: rgba(255, 254, 251, 0.92);
  box-shadow: 0 8px 24px rgba(32, 42, 38, 0.05);
}

.report-map-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}

.section-eyebrow {
  margin: 0 0 3px;
  color: #9a7227;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .14em;
}

.report-map h2 {
  margin: 0;
  font-family: Georgia, "Noto Serif SC", serif;
  font-size: 24px;
  font-weight: 600;
}

.report-map-head p:last-child {
  max-width: 860px;
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.report-toggle { flex: 0 0 auto; }
.report-toggle[aria-pressed="true"] { border-color: #9d762a; background: #f6ecd1; color: #6e4d12; }

.report-map-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.report-map-item {
  min-width: 0;
  padding: 13px;
  border: 1px solid #e1dccf;
  border-radius: 11px;
  background: #fff;
  color: var(--ink);
  text-align: left;
  transition: border-color 150ms, transform 150ms, box-shadow 150ms;
}

.report-map-item:hover,
.report-map-item:focus-visible {
  border-color: #b99246;
  box-shadow: 0 7px 18px rgba(51, 54, 45, 0.07);
  transform: translateY(-1px);
  outline: 0;
}

.report-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}

.report-location {
  padding: 3px 6px;
  border-radius: 999px;
  background: #f3e7c5;
  color: #735318;
  font-size: 8px;
  font-weight: 800;
}

.report-source { color: #8b8f8b; font-size: 8px; }
.report-map-item > strong { display: block; color: #25332e; font-size: 13px; }
.report-series { display: block; margin-top: 3px; color: #858c88; font-size: 8px; }

.report-copy {
  display: block;
  margin-top: 7px;
  color: #56615d;
  font-size: 9px;
  line-height: 1.55;
}

.report-copy b {
  display: inline-block;
  min-width: 48px;
  color: #85631f;
  font-weight: 800;
}

.report-open { display: block; margin-top: 9px; color: #8b641a; font-size: 9px; font-weight: 800; }

.report-external {
  margin-top: 12px;
  border: 1px solid #dfddd6;
  border-radius: 10px;
  background: #f6f5f1;
}

.report-external summary {
  padding: 10px 12px;
  color: #616b67;
  font-size: 10px;
  font-weight: 750;
  cursor: pointer;
}

.report-external-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid #dfddd6;
}

.report-external-item { min-width: 0; padding: 12px; }
.report-external-item + .report-external-item { border-left: 1px solid #dfddd6; }
.report-external-item > span { display: block; color: #8a8e8b; font-size: 8px; }
.report-external-item > strong { display: block; margin-top: 4px; color: #4c5652; font-size: 11px; }
.report-external-item > small { display: block; margin-top: 3px; color: #8b8f8c; font-size: 8px; }
.report-external-item p { margin: 7px 0 0; color: #65706b; font-size: 9px; line-height: 1.5; }
.report-external-item p b { margin-right: 6px; color: #6d7471; }

.toolbar {
  margin-top: 24px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(255, 254, 251, 0.9);
  box-shadow: var(--shadow);
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}

.tab {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: #eceae3;
  color: #53605c;
  font-size: 12px;
  font-weight: 700;
}

.tab[aria-selected="true"] {
  border-color: #a87d2c;
  background: #f9f1dc;
  color: #6a4a10;
}

.toolbar-row {
  display: grid;
  grid-template-columns: minmax(210px, 1.5fr) minmax(150px, .7fr) auto;
  gap: 10px;
  margin-top: 11px;
}

.field {
  position: relative;
}

.field input,
.field select {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  outline: none;
}

.field input { padding: 9px 12px 9px 36px; }
.field select { padding: 9px 32px 9px 11px; }
.field input:focus,
.field select:focus { border-color: #a67d32; box-shadow: 0 0 0 3px rgba(182, 133, 40, 0.12); }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  width: 13px;
  height: 13px;
  border: 1.7px solid #78827e;
  border-radius: 50%;
  transform: translateY(-58%);
  pointer-events: none;
}

.search-icon::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 1.7px;
  right: -5px;
  bottom: -2px;
  background: #78827e;
  transform: rotate(45deg);
}

.global-range {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
}

.global-range button,
.preset-row button {
  min-width: 39px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #64706b;
  font-size: 10px;
  font-weight: 750;
}

.global-range button { min-height: 32px; padding: 0 8px; }
.global-range button.active,
.global-range button:hover,
.preset-row button.active,
.preset-row button:hover { background: #ece7da; color: #6b4b13; }

.results-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 25px 2px 12px;
}

.results-head h2 {
  margin: 0;
  font-family: Georgia, "Noto Serif SC", serif;
  font-size: 24px;
  font-weight: 600;
}

.results-head span { color: var(--muted); font-size: 12px; }

.chart-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}

.chart-card {
  grid-column: span 6;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.chart-card.is-wide { grid-column: 1 / -1; }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 18px 11px;
}

.card-title-wrap { min-width: 0; }

.card-kicker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 7px;
}

.tag {
  padding: 4px 7px;
  border: 1px solid #e0dccf;
  background: #f2f0e9;
  color: #66716d;
  font-size: 9px;
  font-weight: 750;
}

.tag.gold { border-color: #e2c987; background: #fbf3dc; color: #765313; }
.tag.report { border-color: #c7a85d; background: #f5e8c4; color: #6c4b0e; }
.tag.warn { border-color: #e8bbb6; background: #fff0ed; color: #9a3933; }
.tag.error { border-color: #cb8d87; background: #8f3732; color: #fff; }

.quality-banner {
  margin: 0 18px 10px;
  padding: 9px 11px;
  border: 1px solid #ead6a6;
  border-radius: 8px;
  background: #fff9ea;
  color: #755c23;
  font-size: 10px;
  line-height: 1.5;
}
.quality-banner.error { border-color: #e5b4af; background: #fff0ed; color: #883934; }
.quality-banner.stale { border-color: #d5d1c5; background: #f5f3ed; color: #666d69; }

.report-card { border-color: #d0b66f; }

.report-annotation {
  margin: 0 18px 12px;
  border: 1px solid #dfc987;
  border-left: 4px solid #b68528;
  border-radius: 9px;
  background: #fffaf0;
  overflow: hidden;
}

.report-annotation-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 11px 8px;
  border-bottom: 1px solid #eadfbd;
}

.report-annotation-head strong { color: #66470e; font-size: 10px; }
.report-annotation-head span { color: #8b846f; font-size: 8px; text-align: right; }

.report-annotation-grid {
  display: grid;
  grid-template-columns: .9fr 1.2fr 1.5fr;
}

.report-annotation-grid section { min-width: 0; padding: 10px 11px; }
.report-annotation-grid section + section { border-left: 1px solid #eadfbd; }
.report-annotation-grid b { color: #8a6722; font-size: 8px; letter-spacing: .05em; }
.report-annotation-grid p { margin: 4px 0 0; color: #4e5a55; font-size: 9px; line-height: 1.55; }

.report-annotation-source {
  padding: 8px 11px;
  border-top: 1px dashed #dfd0a7;
  color: #77786f;
  font-size: 8px;
}

.report-annotation-source b { color: #6d6652; }
.report-annotation-source small { display: block; margin-top: 4px; color: #8d6020; font-size: 8px; }

.card-head h3 {
  margin: 0;
  font-family: Georgia, "Noto Serif SC", serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
}

.as-of {
  flex: 0 0 auto;
  padding-top: 3px;
  color: var(--muted);
  font-size: 10px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  min-height: 26px;
  padding: 12px 14px 10px;
  border-bottom: 1px solid #efede7;
  background: #fff;
}

.legend-button {
  display: inline-flex;
  flex: 0 1 auto;
  align-items: flex-start;
  gap: 7px;
  max-width: 100%;
  padding: 3px 0;
  border: 0;
  background: transparent;
  color: #35423d;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
}

.legend-button.off { opacity: 0.38; text-decoration: line-through; }
.legend-dot { width: 18px; height: 4px; margin-top: 6px; border-radius: 2px; flex: 0 0 auto; }
.legend-name { min-width: 0; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; white-space: normal; }
.legend-axis { padding-top: 1px; flex: 0 0 auto; color: #77827d; font-size: 10px; white-space: nowrap; }

.chart-size-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  min-height: 38px;
  padding: 0 18px 8px;
}

.chart-size-label {
  display: flex;
  flex: 1 1 170px;
  min-width: 0;
  margin-right: auto;
  flex-direction: column;
  color: var(--muted);
}

.chart-size-label b { color: #52605a; font-size: 9px; }
.chart-size-label small { font-size: 8px; font-variant-numeric: tabular-nums; }

.size-tool,
.chart-resizer {
  min-width: 38px;
  min-height: 32px;
  padding: 0 9px;
  border: 1px solid #ddd8ca;
  border-radius: 7px;
  background: #fff;
  color: #5b6762;
  font-size: 9px;
  font-weight: 750;
}

.size-tool:hover,
.size-tool:focus-visible,
.chart-resizer:hover,
.chart-resizer:focus-visible,
.chart-resizer.active {
  border-color: #c19b42;
  background: #faf3df;
  color: #6b4b13;
  outline: none;
}

.size-tool[aria-pressed="true"] { background: #ece7da; color: #6b4b13; }
.size-tool:disabled { cursor: progress; opacity: 0.58; }
.export-svg {
  border-color: #c9a85c;
  background: #fbf4df;
  color: #704f13;
}

.chart-resizer {
  position: relative;
  width: auto;
  min-width: 78px;
  padding: 0 27px 0 10px;
  cursor: nwse-resize;
  touch-action: none;
}

.chart-resizer strong { font: inherit; white-space: nowrap; }

.chart-resizer span {
  position: absolute;
  right: 9px;
  bottom: 7px;
  width: 14px;
  height: 14px;
  background: repeating-linear-gradient(135deg, transparent 0 3px, #9c7a2f 3px 4.5px);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

body.chart-resizing { cursor: nwse-resize; user-select: none; }

.chart-stage {
  position: relative;
  height: clamp(240px, var(--chart-height, 292px), 720px);
  margin: 0;
  background: #fff;
}

.chart-visual {
  margin: 0 10px;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  border: 1px solid #e8e4d8;
  border-radius: 9px;
  background: #fff;
}

.chart-stage canvas,
.navigator canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.chart-stage canvas { touch-action: pan-y; }
.navigator canvas { touch-action: none; }

.chart-stage canvas:focus-visible,
.navigator canvas:focus-visible { outline: 2px solid #b68528; outline-offset: -2px; }

.chart-tooltip {
  position: absolute;
  z-index: 4;
  min-width: 164px;
  max-width: 260px;
  padding: 8px 9px;
  border: 1px solid rgba(30, 44, 38, 0.12);
  border-radius: 8px;
  background: rgba(20, 35, 31, 0.94);
  color: #fff;
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
  font-size: 9px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity 80ms, transform 80ms;
}

.chart-tooltip.show { opacity: 1; transform: translateY(0); }
.tooltip-date { margin-bottom: 4px; color: #d9c48d; font-weight: 750; }
.tooltip-row { display: grid; grid-template-columns: 7px minmax(0,1fr) auto; gap: 6px; align-items: center; }
.tooltip-swatch { width: 6px; height: 6px; border-radius: 50%; }
.tooltip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tooltip-value { font-variant-numeric: tabular-nums; }

.navigator {
  height: 56px;
  margin: 0;
  border-top: 1px solid #efede7;
  border-bottom: 1px solid #efede7;
  background: #f9f8f4;
}

.preset-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 2px;
  padding: 6px 16px;
}

.range-status {
  display: flex;
  min-width: 0;
  margin-right: auto;
  flex-direction: column;
  color: var(--muted);
}

.range-date {
  color: #4b5853;
  font-size: 11px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.range-help { color: var(--muted); font-size: 9px; font-weight: 500; }
.preset-row button { min-height: 30px; padding: 0 8px; font-size: 11px; }

.metric-wrap {
  overflow-x: auto;
  margin: 0 16px 13px;
  border: 1px solid #ebe8df;
  border-radius: 10px;
}

.metric-table {
